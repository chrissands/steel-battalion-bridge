name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the builds to this existing release tag (e.g. v1.1.0). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the Fluent UI bundle and check it matches web/dist
        run: |
          cd web && npm ci && npm run build
          git diff --stat --exit-code -- dist ../docs/demo || (echo "web/dist is stale: run 'npm run build' in web/ and commit" && exit 1)

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}";
          elif [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"; else tag=""; fi
          if [[ -n "$tag" ]]; then echo "version=${tag#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build SBBridge.exe (.NET Framework 4.8 + WebView2)
        run: |
          dotnet build src/SBBridge/SBBridge.csproj -c Release -p:Version=${{ needs.version.outputs.version }}
          mkdir -p dist/win
          cp -r src/SBBridge/bin/Release/net48/. dist/win/
          rm -f dist/win/*.pdb dist/win/*.xml
          find dist/win -type f | sort
          cp dist/win/SBBridge.exe SBBridge.exe

      - name: Build sbdriver.exe (MinGW)
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          CC=gcc ./driver-helper/build.sh

      - name: Download ViGEmBus installer
        run: |
          mkdir -p redist
          curl -fL -o redist/ViGEmBus_setup.exe https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe

      - name: Build installer (NSIS)
        run: |
          "/c/Program Files (x86)/NSIS/makensis.exe" -V3 -DAPP_VERSION=${{ needs.version.outputs.version }} installer/SBBridge.nsi

      - name: Run tests on real Windows / WinForms
        run: |
          dotnet build tests/windows/WinTests.csproj -c Release
          ./tests/windows/bin/Release/net48/WinTests.exe | tee results.txt
          ! grep -q FAIL results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SBBridge-windows-${{ needs.version.outputs.version }}
          path: |
            SBBridge-Setup-*.exe
            SBBridge.exe

      - name: Attach to release
        if: needs.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: SBBridge-Setup-*.exe

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: |
          dotnet build -c Release tests/linux/LinuxTests.csproj
          HOME=/tmp/testhome dotnet tests/linux/bin/Release/net8.0/LinuxTests.dll

      - name: Check shell scripts
        run: shellcheck -S warning linux/install.sh linux/uninstall.sh build-linux.sh

      - name: Build self-contained Linux release
        run: ./build-linux.sh "${{ needs.version.outputs.version }}"

      - name: Smoke-test the published binary
        run: |
          out/linux/sbbridge/sbbridge --version
          HOME=/tmp/smoke timeout 6 out/linux/sbbridge/sbbridge --port 8799 & sleep 4
          curl -fsS http://127.0.0.1:8799/api/state | head -c 300; echo
          curl -fsS -o /dev/null http://127.0.0.1:8799/
          wait || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbbridge-linux-x64-${{ needs.version.outputs.version }}
          path: out/sbbridge-linux-x64.tar.gz

      - name: Attach to release
        if: needs.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: out/sbbridge-linux-x64.tar.gz
