name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Mono, mingw-w64, NSIS)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends mono-devel mono-mcs libmono-system-windows-forms4.0-cil libgdiplus gcc-mingw-w64-x86-64 nsis xvfb

      - name: Build app, driver helper and installer
        run: ./build-installer.sh "${{ needs.version.outputs.version }}"

      - name: Run tests (Mono + Xvfb)
        run: |
          cd src/SBBridge
          mcs -target:exe -sdk:4.8 -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.Xml.dll -r:System.Core.dll -r:Microsoft.VisualBasic.dll \
            -out:/tmp/tests.exe ../../tests/LogicAndUiTests.cs $(find Core Platform UI -name '*.cs')
          HOME=/tmp/testhome xvfb-run -a mono /tmp/tests.exe | tee /tmp/results.txt
          ! grep -q FAIL /tmp/results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SBBridge-windows-${{ needs.version.outputs.version }}
          path: |
            SBBridge-Setup-*.exe
            SBBridge.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SBBridge-Setup-*.exe

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: |
          dotnet build -c Release tests/linux/LinuxTests.csproj
          HOME=/tmp/testhome dotnet tests/linux/bin/Release/net8.0/LinuxTests.dll

      - name: Check shell scripts
        run: shellcheck -S warning linux/install.sh linux/uninstall.sh build-linux.sh

      - name: Build self-contained Linux release
        run: ./build-linux.sh "${{ needs.version.outputs.version }}"

      - name: Smoke-test the published binary
        run: |
          out/linux/sbbridge/sbbridge --version
          HOME=/tmp/smoke timeout 6 out/linux/sbbridge/sbbridge --port 8799 & sleep 4
          curl -fsS http://127.0.0.1:8799/api/state | head -c 300; echo
          curl -fsS -o /dev/null http://127.0.0.1:8799/
          wait || true

      - uses: actions/upload-artifact@v4
        with:
          name: sbbridge-linux-x64-${{ needs.version.outputs.version }}
          path: out/sbbridge-linux-x64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/sbbridge-linux-x64.tar.gz
