name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Mono, mingw-w64, NSIS)
        run: sudo apt-get update && sudo apt-get install -y mono-devel mingw-w64 nsis

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi

      - name: Build app, driver helper and installer
        run: ./build-installer.sh "${{ steps.ver.outputs.version }}"

      - name: Run tests (Mono + Xvfb)
        run: |
          sudo apt-get install -y xvfb
          cd src/SBBridge
          mcs -target:exe -sdk:4.8 -r:System.Windows.Forms.dll -r:System.Drawing.dll -r:System.Xml.dll -r:System.Core.dll -r:Microsoft.VisualBasic.dll \
            -out:/tmp/tests.exe ../../tests/LogicAndUiTests.cs $(find Core Platform UI -name '*.cs')
          HOME=/tmp/testhome xvfb-run -a mono /tmp/tests.exe | tee /tmp/results.txt
          ! grep -q FAIL /tmp/results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SBBridge-${{ steps.ver.outputs.version }}
          path: |
            SBBridge-Setup-*.exe
            SBBridge.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SBBridge-Setup-*.exe
          generate_release_notes: true
